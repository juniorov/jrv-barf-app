name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Rama a deployar'
        required: true
        default: 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e

            cd /var/www/html/app-barf

            echo "→ Pulling branch ${{ github.event.inputs.branch || 'main' }}..."
            git fetch origin
            git checkout ${{ github.event.inputs.branch || 'main' }}
            git pull --no-rebase origin ${{ github.event.inputs.branch || 'main' }}

            echo "→ Installing dependencies..."
            npm ci --prefer-offline

            echo "→ Restarting API..."
            pm2 restart barf-api

            echo "✓ Deploy completed successfully"